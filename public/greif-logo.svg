<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 120" role="img" aria-labelledby="title desc">
  <title id="title">GREIF logo</title>
  <desc id="desc">Logo da GREIF com fundo verde escuro e texto GREIF destacado.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d5e5a"/>
      <stop offset="100%" stop-color="#173722"/>
    </linearGradient>
    <linearGradient id="text" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#dff7e7" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#7ac3a0" stop-opacity="0.88"/>
    </linearGradient>
  </defs>
  <rect width="260" height="120" rx="10" fill="url(#bg)"/>
  <text x="130" y="86" text-anchor="middle" font-size="104" font-family="Arial Black, Arial, sans-serif" font-weight="900" letter-spacing="2" fill="url(#text)">GREIF</text>
</svg>
